name: Maldives photo essay checks
on:
  pull_request:
    paths:
      - app.js
      - content.js
      - sitemap.xml
      - journeys/maldives-ithaafushi/**
      - images/maldives/**
      - maldives-feature.css
      - maldives-gallery.js
      - tests/check-maldives.mjs
      - .github/workflows/maldives-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate Maldives story and media
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check maldives-gallery.js
          node --check tests/check-maldives.mjs
      - name: Verify article, routing, media and privacy
        run: node tests/check-maldives.mjs
