name: Alhambra feature checks
on:
  pull_request:
    paths:
      - 'alhambra-*.js'
      - 'alhambra-*.css'
      - 'app.js'
      - 'index.html'
      - 'images/alhambra/**'
      - 'tests/check-alhambra.mjs'
      - '.github/workflows/alhambra-checks.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check content.js
          node --check alhambra-photos.js
          node --check alhambra-feature.js
      - name: Editorial and image integrity tests
        run: node tests/check-alhambra.mjs